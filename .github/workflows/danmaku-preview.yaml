name: Danmaku / Signed release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: danmaku-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'z979054461/jellyfin-androidtv' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: v0.20.0-danmaku.1
      RELEASE_APK: jellyfin-danmaku-200001.apk
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      - name: Install Android SDK 37 tools
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37" "build-tools;37.0.0"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt"
          echo "RELEASE_BUILD_TOOLS=$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_ENV"
      - name: Test parser, timeline and playback metadata formatting
        run: |
          python3 tools/resource-tests/run.py
          bash tools/danmaku-tests/run.sh
          bash tools/update-tests/run.sh
          sh tools/network-tests/run.sh
          sh tools/network-label-tests/run.sh
          sh tools/hold-speed-tests/run.sh
          sh tools/installer-tests/run.sh
      - name: Prepare fixed release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.DANMAKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DANMAKU_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.DANMAKU_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.DANMAKU_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Release signing is not configured. Checks will run, but no APK will be published.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/danmaku-release.p12"
          test -s "$RUNNER_TEMP/danmaku-release.p12"
          java tools/signing/VerifyReleaseKey.java "$RUNNER_TEMP/danmaku-release.p12" \
            config/danmaku-signing.sha256 "$RUNNER_TEMP/danmaku-key-alias"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Build release and run repository checks
        env:
          SIGNING_READY: ${{ steps.signing.outputs.ready }}
          KEYSTORE_FILE: ${{ runner.temp }}/danmaku-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.DANMAKU_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.DANMAKU_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.DANMAKU_KEY_PASSWORD }}
        run: |
          if [ "$SIGNING_READY" != 'true' ]; then
            unset KEYSTORE_FILE KEYSTORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD
          else
            export SIGNING_KEY_ALIAS="$(cat "$RUNNER_TEMP/danmaku-key-alias")"
          fi
          ./gradlew assembleDebug assembleRelease test detekt lint --no-daemon
      - name: Verify signed release identity
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          TOOLS="$RELEASE_BUILD_TOOLS"
          APK=$(python3 - <<'PYCODE'
          import json, pathlib
          root = pathlib.Path('app/build/outputs/apk/release')
          metadata = json.loads((root / 'output-metadata.json').read_text())
          assert metadata['applicationId'] == 'io.github.z979054461.jellyfin.danmaku'
          assert len(metadata['elements']) == 1
          element = metadata['elements'][0]
          assert element['versionCode'] == 200001
          assert element['versionName'] == '0.20.0-danmaku.1'
          path = root / element['outputFile']
          assert path.is_file() and 0 < path.stat().st_size < 200 * 1024 * 1024
          print(path)
          PYCODE
          )
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/danmaku-signature.txt"
          EXPECTED=$(tr -d '[:space:]' < config/danmaku-signing.sha256)
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/danmaku-signature.txt")
          test "$EXPECTED" = "$ACTUAL"
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/danmaku-badging.txt"
          grep -F "package: name='io.github.z979054461.jellyfin.danmaku' versionCode='200001' versionName='0.20.0-danmaku.1'" "$RUNNER_TEMP/danmaku-badging.txt"
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/danmaku-manifest.txt"
          if grep -Eq 'android:debuggable.*0xffffffff' "$RUNNER_TEMP/danmaku-manifest.txt"; then
            echo 'Refusing to publish a debuggable APK.' >&2
            exit 1
          fi
          rm -rf build/danmaku-release
          mkdir -p build/danmaku-release
          cp "$APK" build/danmaku-release/jellyfin-danmaku-200001.apk
      - name: Publish verified APK without replacing tags or assets
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only an explicit 404 means absent. Authentication/network errors fail closed.
          api_optional() {
            if gh api "$1" > "$2" 2> "$RUNNER_TEMP/danmaku-api-error.txt"; then
              return 0
            fi
            if grep -Fq '(HTTP 404)' "$RUNNER_TEMP/danmaku-api-error.txt"; then
              return 1
            fi
            echo 'Cannot verify existing release state; refusing publication.' >&2
            exit 1
          }
          TAG_JSON="$RUNNER_TEMP/danmaku-tag.json"
          if api_optional "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" "$TAG_JSON"; then
            # Resolve annotated tags as well as lightweight tags, without moving either.
            for attempt in 1 2 3 4 5; do
              TYPE=$(jq -r '.object.type' "$TAG_JSON")
              SHA=$(jq -r '.object.sha' "$TAG_JSON")
              if [ "$TYPE" = commit ]; then break; fi
              test "$TYPE" = tag
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" > "$TAG_JSON.next"
              mv "$TAG_JSON.next" "$TAG_JSON"
            done
            test "$(jq -r '.object.type' "$TAG_JSON")" = commit
            test "$(jq -r '.object.sha' "$TAG_JSON")" = "$GITHUB_SHA"
          else
            # Create only this new tag, explicitly at the fully checked revision.
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" > "$TAG_JSON"
            test "$(jq -r '.object.sha' "$TAG_JSON")" = "$GITHUB_SHA"
          fi
          RELEASE_JSON="$RUNNER_TEMP/danmaku-release.json"
          if ! api_optional "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" "$RELEASE_JSON"; then
            # Keep a partial upload private. A retry must verify it, never overwrite it.
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title 'Jellyfin TV 0.20.0 弹幕定制版 1' \
              --notes-file docs/releases/danmaku-0.20.0-1.md \
              "build/danmaku-release/$RELEASE_APK"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RELEASE_JSON"
          fi
          EXPECTED_DIGEST=$(sha256sum "build/danmaku-release/$RELEASE_APK" | cut -d ' ' -f 1)
          # Exactly one asset is permitted: no checksum files, keys, configs or logs.
          jq -e --arg name "$RELEASE_APK" --arg digest "sha256:$EXPECTED_DIGEST" '
            (.assets | length) == 1 and
            .assets[0].name == $name and .assets[0].state == "uploaded" and
            .assets[0].digest == $digest
          ' "$RELEASE_JSON" > /dev/null
          ASSET_ID=$(jq -r '.assets[0].id' "$RELEASE_JSON")
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$RUNNER_TEMP/danmaku-uploaded.apk"
          test "$(sha256sum "$RUNNER_TEMP/danmaku-uploaded.apk" | cut -d ' ' -f 1)" = "$EXPECTED_DIGEST"
          if [ "$(jq -r '.draft' "$RELEASE_JSON")" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          else
            # A matching public release is a no-op; never rewrite its assets or notes.
            test "$(jq -r '.prerelease' "$RELEASE_JSON")" = false
          fi
          echo "Verified $RELEASE_TAG at $GITHUB_SHA; APK SHA-256: $EXPECTED_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/danmaku-release.p12" "$RUNNER_TEMP/danmaku-key-alias" \
            "$RUNNER_TEMP/danmaku-signature.txt" "$RUNNER_TEMP/danmaku-badging.txt" \
            "$RUNNER_TEMP/danmaku-manifest.txt" "$RUNNER_TEMP/danmaku-uploaded.apk" \
            "$RUNNER_TEMP/danmaku-api-error.txt"
