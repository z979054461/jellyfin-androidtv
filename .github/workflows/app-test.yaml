name: App / Test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test custom playback and update policies
        run: |
          bash tools/danmaku-tests/run.sh
          bash tools/update-tests/run.sh
          sh tools/network-tests/run.sh
          sh tools/network-label-tests/run.sh
          sh tools/hold-speed-tests/run.sh
          sh tools/installer-tests/run.sh
      - name: Run test task
        run: ./gradlew test
